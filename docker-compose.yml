services:
  menu-dashboard:
    build: .
    container_name: menu-scraper
    restart: unless-stopped
    expose:
      - "8787"
    networks:
      - coolify
    volumes:
      - menu_data:/data
    environment:
      - ZYTE_API_KEY=${ZYTE_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
      - MENU_OUTPUT_PATH=/data/menus.json
      - MENU_CSV_PATH=/data/menus.csv
      - MENU_LOG_PATH=/data/scrape_menus.log
      - MENU_DISCOVERED_PATH=/data/nouveauurl.txt
      - MENU_URLS_PATH=/data/urls.txt
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.menu-dashboard.entrypoints=https"
      - "traefik.http.routers.menu-dashboard.tls=true"
      - "traefik.http.routers.menu-dashboard.tls.certresolver=letsencrypt"
      - "traefik.http.services.menu-dashboard.loadbalancer.server.port=8787"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8787/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  coolify:
    external: true

volumes:
  menu_data:
